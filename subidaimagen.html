<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Imagen</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="img/ic_onlyfans.jpg" type="image/x-icon">
</head>
<body background="img/amy-humphries-2M_sDJ_agvs-unsplash.jpg">
    <div class="container">
        <div class="izquierda">
            <img src="img/Onlyfans-Logo.png" alt="Logo">
        </div>
        <div class="derecha">
            <h1>Carga de fotos</h1>
    <form>
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="descripcion">Descripción:</label><br>
        <textarea id="descripcion" name="descripcion" rows="4" required></textarea><br><br>

        <label for="fecha">Fecha:</label><br>
        <label for="file_type">Tipo de Archivo:</label>
        <select id="file_type" name="file_type">
            <option value="imagen">image</option>
            <option value="video">video</option>
            <option value="text">text</option>
        </select>
        <br><br>
        <label for="fecha">Fecha:</label><br>
        <input type="date" id="fecha" name="fecha" required><br><br>

        <label for="imagen">Seleccionar Imagen:</label><br>
        <input type="file" id="imagen" name="imagen" accept="image/*" required><br><br>

        <input type="submit" value="Subir Imagen">
    </form>
    </div>
</div>
</body>
</html>
